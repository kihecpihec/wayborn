name: Razvojna naloga
description: Naloga z odgovornostjo, prioriteto in merili sprejema
title: "[Naloga] "
body:
  - type: textarea
    id: opis
    attributes:
      label: Opis in cilj
    validations:
      required: true
  - type: dropdown
    id: prioriteta
    attributes:
      label: Prioriteta
      options:
        - P0
        - P1
        - P2
    validations:
      required: true
  - type: textarea
    id: sprejem
    attributes:
      label: Merila sprejema
      description: Dodaj preverljive pogoje in dodeli odgovorno osebo v Assignees.
    validations:
      required: true
